# ---------------------------------------------------------------------------
# Application pipeline.  app/**  ->  test, build, push, deploy, verify
#
# Pull request : test and build only. No AWS credentials are issued, not even
#                for a branch in this repository: a test job does not need
#                them, so it does not get them.
# Push to main : the full delivery path, behind the demo-app environment.
#
# Images are tagged with the full commit SHA. `latest` is pushed as a
# convenience pointer only and is never what gets deployed, because a mutable
# tag makes it impossible to say which code is actually running.
# ---------------------------------------------------------------------------
name: application

on:
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/application.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/application.yml'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE }}
  TASK_FAMILY: ${{ vars.ECS_TASK_FAMILY }}
  CONTAINER_NAME: code-busters

jobs:
  test:
    name: test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: app/requirements-dev.txt

      - name: Install pinned dependencies
        run: pip install -r requirements-dev.txt
        working-directory: app

      - name: Lint
        run: ruff check .
        working-directory: app

      - name: Unit tests
        run: pytest
        working-directory: app

      # Build on every pull request too. A green test suite with a broken
      # Dockerfile still breaks the deploy, and finding that out on main is
      # the worst possible time.
      - name: Build the image
        run: |
          docker build \
            --build-arg APP_COMMIT="${GITHUB_SHA}" \
            --build-arg APP_VERSION="0.1.0" \
            -t code-busters:ci app

  deploy:
    name: deploy to ECS
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: demo-app

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Assume the application deploy role via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_APP_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-app-deploy-${{ github.run_id }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2.2.0

      - name: Build, tag and push
        id: build
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="${REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          docker build \
            --build-arg APP_COMMIT="${GITHUB_SHA}" \
            --build-arg APP_VERSION="0.1.0" \
            -t "${IMAGE}" app
          docker push "${IMAGE}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      # Read the task definition Terraform owns, swap ONLY the image, and
      # register the result. Everything else -- roles, log configuration,
      # environment, cpu and memory -- is carried over untouched, which is
      # what keeps the two systems from overwriting each other.
      - name: Download the current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${TASK_FAMILY}" \
            --query taskDefinition > task-definition.json

      - name: Render the new task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1.9.1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build.outputs.image }}

      - name: Deploy and wait for steady state
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2.6.4
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Resolve the public URL
        id: url
        run: |
          # The hostname comes from a repository variable, not from the load
          # balancer's generated name, because that is the name the audience
          # sees. Falls back to the ALB's own DNS name before phase 3 lands.
          if [ -n "${{ vars.APP_URL }}" ]; then
            echo "url=${{ vars.APP_URL }}" >> "$GITHUB_OUTPUT"
          else
            dns=$(aws elbv2 describe-load-balancers \
              --names "${ECS_CLUSTER}" \
              --query 'LoadBalancers[0].DNSName' --output text)
            echo "url=http://${dns}" >> "$GITHUB_OUTPUT"
          fi

      # The deployment is not finished because ECS says the service is
      # stable. It is finished when the public URL serves THIS commit.
      - name: Verify the live endpoint serves this commit
        run: |
          url="${{ steps.url.outputs.url }}"
          curl -sf --retry 10 --retry-delay 5 --retry-all-errors "${url}/health"
          echo
          for i in $(seq 1 12); do
            live=$(curl -sf "${url}/version" | sed -n 's/.*"commit":"\([^"]*\)".*/\1/p')
            echo "attempt ${i}: live commit ${live:-none}"
            [ "${live}" = "${GITHUB_SHA}" ] && exit 0
            sleep 10
          done
          echo "the live endpoint never served ${GITHUB_SHA}"
          exit 1

      - name: Summary
        run: |
          {
            echo "### Deployed"
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- image: \`${{ steps.build.outputs.image }}\`"
            echo "- url: ${{ steps.url.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"
